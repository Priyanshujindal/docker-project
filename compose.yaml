
services:
  api:
    image: priyanshujindal/task-manager-api:latest
    container_name: task-manager-api
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      MONGO_URI: "mongodb://mongodb:27017/taskmanager"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: task-manager-mongodb
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mongo-data:
